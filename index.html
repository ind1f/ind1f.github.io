---
layout: default
---
<section class="intro">
  <p>Trying to figure out what to do with my life. </p>
</section>

<section>
  <h2>Writing</h2>
  <ul class="posts">
    {% for post in site.posts %}
    <li>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y-%m-%d' }}</time>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
  </ul>
</section>
